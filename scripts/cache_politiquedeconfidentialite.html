vec :\\nNos prestataires techniques (hébergeur, outils d’analyse, etc.).\\nLes autorités compétentes si la loi l’exige.\\n\\n7. Durée de conservation\\nVos données sont conservées pendant une durée strictement nécessaire aux finalités mentionnées ci-dessus :\\nDonnées de contact : 3 ans après le dernier échange.\\nDonnées de navigation (cookies) : voir la durée indiquée dans notre politique de cookies.\\nDonnées liées aux obligations légales : durée imposée par la loi.\\n\\n8. Vos droits\\nConformément au RGPD, vous disposez des droits suivants concernant vos données :\\nDroit d’accès : consulter les données que nous détenons sur vous.\\nDroit de rectification : corriger des données inexactes ou incomplètes.\\nDroit à l’effacement : demander la suppression de vos données.\\nDroit à la limitation : limiter le traitement de vos données.\\nDroit d’opposition : refuser certains traitements de vos données.\\nDroit à la portabilité : recevoir vos données dans un format structuré.\\nPour exercer vos droits, contactez-nous à spherafilms.contact@gmail.com.\\nVous pouvez également déposer une plainte auprès de la CNIL (www.cnil.fr) si vous estimez que vos droits ne sont pas respectés.\\n\\n9. Cookies\\nNotre site utilise des cookies pour améliorer votre expérience et mesurer l’audience.\\nVous pouvez gérer vos préférences via la bannière de gestion des cookies lors de votre première visite.\\nConsultez notre Politique de Cookies pour plus de détails.\\n\\n10. Sécurité\\nNous mettons en œuvre des mesures techniques et organisationnelles pour protéger vos données contre tout accès non autorisé, perte, altération ou divulgation.\\n11. Modifications\\n\\nCette Politique de Confidentialité peut être mise à jour à tout moment.\\nLa date de la dernière mise à jour est indiquée ci-dessous.\\nDernière mise à jour : 14 avril 2025\\n"}],"B":[{"A?":"A","A":{"text-align":{"B":"center"},"color":{"B":"#ffffff"},"leading":{"B":"1530.0"},"font-size":{"B":"23.5631"},"font-family":{"B":"YAFdJt8
